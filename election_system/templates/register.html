{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-3">Voter Registration</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input id="username" type="text" name="username" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" type="password" name="password" class="form-control" autocomplete="new-password"
                               minlength="{{ min_password_length }}" pattern="{{ password_pattern }}"
                               aria-describedby="password-help" required>
                        <div id="password-help" class="form-text">Use at least {{ min_password_length }} characters, including an English letter and a digit.</div>
                    </div>
                    <button class="btn btn-success w-100">Register Voter Account</button>
                </form>
                <a href="{{ url_for('auth.login') }}" class="d-block text-center mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
